
#YSM Render Compat - Client Settings
#Adjust halo positions and rotations if effects appear at the wrong location or angle.
#Position offsets are in pixels (1 block = 16 pixels).
#Rotation angles are in degrees.
#
#Coordinate system (Minecraft world space):
#  X = left(-) / right(+)
#  Y = up(+) / down(-)
#  Z = forward(+) / back(-)
#  X-rotation = pitch (positive = look down, negative = look up)
#  Y-rotation = yaw (positive = turn right, negative = turn left)
#  Z-rotation = roll (positive = tilt right, negative = tilt left)
[ascension_halo]
	#Position & rotation for the Ascension Halo (goety_revelation:ascension_halo).
	#The standard golden halo granted by the Ascension ability.
	#Whether to render this halo.
	enabled = true

	[ascension_halo.position]
		#Horizontal offset (pixels).
		#Range: -128.0 ~ 128.0
		xOffset = 0.0
		#Vertical offset (pixels).
		#Range: 0.0 ~ 128.0
		yOffset = 30.0
		#Forward/back offset (pixels).
		#Range: -128.0 ~ 128.0
		zOffset = -8.0

	[ascension_halo.rotation]
		#X-axis rotation (degrees). Positive = tilt downward, negative = tilt upward.
		#Range: -180.0 ~ 180.0
		xRot = -90.0
		#Y-axis rotation (degrees).
		#Range: -180.0 ~ 180.0
		yRot = 0.0
		#Z-axis rotation (degrees).
		#Range: -180.0 ~ 180.0
		zRot = 0.0

